[project]
name = "web-mcp-server"
version = "0.1.0"
description = "MCP server for web search and web fetch"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "ddgs>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.12.0",
]

[project.scripts]
web-mcp = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
